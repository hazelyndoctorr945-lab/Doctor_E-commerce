<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CalidaTech Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ===========================
         MAIN CONTAINER
    ============================ -->

    <div class="container" id="container">


        <!-- ===========================
             LOGIN FORM
        ============================ -->

        <div class="form-container login-container">

            <form id="loginForm">

                <h1>Login</h1>


                <!-- Username -->

                <div class="input-box">

                    <i class="fa-solid fa-user lock-icon"></i>

                    <input
                        type="text"
                        id="loginUsername"
                        placeholder="Username"
                        required>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock lock-icon"></i>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Password"
                        required>

                    <i class="fa-solid fa-eye toggle-password"></i>

                </div>


                <!-- Forgot Password -->

                <a
                    href="#"
                    class="forgot"
                    id="forgotPassword">

                    Forgot Password?

                </a>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="btn">

                    Login

                </button>


                <!-- Register Link -->

                <p class="switch-text">

                    Don't have an account?

                    <a
                        href="#"
                        id="registerLink">

                        Register

                    </a>

                </p>


                <!-- Divider -->

                <div class="divider">

                    <span>OR</span>

                </div>


                <!-- Google Button -->

                <button
                    type="button"
                    class="google-btn">

                    <i class="fa-brands fa-google"></i>

                    Continue with Google

                </button>

            </form>

        </div>



        <!-- ===========================
             REGISTER FORM
        ============================ -->

        <div class="form-container register-container">

            <form id="registerForm">

                <h1>Create Account</h1>


                <!-- Username -->

                <div class="input-box">

                    <i class="fa-solid fa-user lock-icon"></i>

                    <input
                        type="text"
                        id="regUsername"
                        placeholder="Username"
                        required>

                </div>


                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope lock-icon"></i>

                    <input
                        type="email"
                        id="regEmail"
                        placeholder="Email"
                        required>

                </div>


                <!-- Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock lock-icon"></i>

                    <input
                        type="password"
                        id="regPassword"
                        placeholder="Password"
                        required>

                </div>


                <!-- Confirm Password -->

                <div class="input-box">

                    <i class="fa-solid fa-lock lock-icon"></i>

                    <input
                        type="password"
                        id="regConfirmPassword"
                        placeholder="Confirm Password"
                        required>

                </div>


                <!-- Register Button -->

                <button
                    type="submit"
                    class="btn">

                    Register

                </button>


                <!-- Login Link -->

                <p class="switch-text">

                    Already have an account?

                    <a
                        href="#"
                        id="loginLink">

                        Login

                    </a>

                </p>

            </form>

        </div>



        <!-- ===========================
             TOGGLE PANEL
        ============================ -->

        <div class="toggle-container">

            <div class="toggle">


                <!-- LEFT PANEL -->

                <div class="toggle-panel toggle-left">

                    <h1>Welcome!</h1>

                    <p>
                        Create your CalidaTech account.
                    </p>

                    <button
                        class="hidden"
                        id="register"
                        type="button">

                        Register

                    </button>

                </div>


                <!-- RIGHT PANEL -->

                <div class="toggle-panel toggle-right">

                    <h1>Welcome Back!</h1>
                  <h4>to  <span class="calidatech-text">CalidaTech</span></h4>
                    <br>
                    <p>
                        Already have an account?
                    </p>

                    <button
                        class="hidden"
                        id="login"
                        type="button">

                        Login

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ===========================
         SUCCESS POPUP
    ============================ -->

    <div
        class="popup"
        id="successPopup">

        <div class="popup-content">

            <i class="fa-solid fa-circle-check"></i>

            <h2>Success!</h2>

            <p id="popupMessage">
                Registration completed successfully.
            </p>

            <button id="closePopup">
                OK
            </button>

        </div>

    </div>



    <!-- JavaScript -->

    <script src="login.js"></script>

</body>

</html>
